# Production-style setup: docker compose up -d --build
# Put a TLS-terminating reverse proxy in front of port 8000.
services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - radar-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

volumes:
  radar-data:
